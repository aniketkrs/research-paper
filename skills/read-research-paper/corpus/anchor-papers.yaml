# Bundled corpus of canonical anchor papers — read-research-paper skill.
#
# This file ships WITH the skill. It is the offline / fallback layer:
# when live fetch fails AND the user's local cache doesn't have the
# paper, the skill checks here BEFORE falling back to model-knowledge.
#
# Each entry is a complete paper-data.json record per
# schemas/visual-paper.json — enough metadata that the skill can render
# a high-quality visual paper without any web access.
#
# To extend: drop new entries into corpus/user/ as YAML files in this
# format. They're loaded alongside the bundled ones at runtime.

# Index keyed by canonical_id (arxiv:<id> or doi:<doi>).
papers:

  - canonical_id: "arxiv:1706.03762"
    title: "Attention Is All You Need"
    authors:
      - {family: Vaswani,    given: Ashish}
      - {family: Shazeer,    given: Noam}
      - {family: Parmar,     given: Niki}
      - {family: Uszkoreit,  given: Jakob}
      - {family: Jones,      given: Llion}
      - {family: Gomez,      given: "Aidan N."}
      - {family: Kaiser,     given: Lukasz}
      - {family: Polosukhin, given: Illia}
    year: 2017
    venue: "Advances in Neural Information Processing Systems (NeurIPS)"
    arxiv_id: "1706.03762"
    doi: ""
    url: "https://arxiv.org/abs/1706.03762"
    abstract: >
      The dominant sequence transduction models are based on complex
      recurrent or convolutional neural networks that include an encoder
      and a decoder. The best performing models also connect the encoder
      and decoder through an attention mechanism. We propose a new simple
      network architecture, the Transformer, based solely on attention
      mechanisms, dispensing with recurrence and convolutions entirely.
      Experiments on two machine translation tasks show these models to
      be superior in quality while being more parallelizable and
      requiring significantly less time to train.
    topics: [transformers, attention, machine-translation, deep-learning]
    headline_numbers:
      - {value: "28.4 BLEU", metric: "WMT 2014 EN-DE", context: "BLEU score on the WMT 2014 English-to-German translation task", direction: "increase", importance_rank: 1}
      - {value: "41.8 BLEU", metric: "WMT 2014 EN-FR", context: "BLEU score on the WMT 2014 English-to-French translation task", direction: "increase", importance_rank: 2}
    contribution_list:
      - "Proposes the Transformer architecture, based solely on attention mechanisms"
      - "Achieves state-of-the-art on two machine translation benchmarks"
      - "Trains significantly faster due to better parallelization"
    limitations:
      - "Quadratic memory complexity in sequence length"
      - "Evaluated only on translation; generalization to other tasks open at the time"
    cache_metadata:
      version: 1
      source: "bundled-corpus"
      skill_version: "1.0.0"

  - canonical_id: "arxiv:2005.11401"
    title: "Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks"
    authors:
      - {family: Lewis,    given: Patrick}
      - {family: Perez,    given: Ethan}
      - {family: Piktus,   given: Aleksandra}
      - {family: Petroni,  given: Fabio}
      - {family: Karpukhin, given: Vladimir}
      - {family: Goyal,    given: Naman}
      - {family: Küttler,  given: Heinrich}
      - {family: Lewis,    given: Mike}
      - {family: Yih,      given: "Wen-tau"}
      - {family: Rocktäschel, given: Tim}
      - {family: Riedel,   given: Sebastian}
      - {family: Kiela,    given: Douwe}
    year: 2020
    venue: "Advances in Neural Information Processing Systems (NeurIPS)"
    arxiv_id: "2005.11401"
    doi: "10.48550/arXiv.2005.11401"
    url: "https://arxiv.org/abs/2005.11401"
    abstract: >
      Large pre-trained language models have been shown to store factual
      knowledge in their parameters, and achieve state-of-the-art results
      when fine-tuned on downstream NLP tasks. However, their ability to
      access and precisely manipulate knowledge is still limited, and
      hence on knowledge-intensive tasks, their performance lags behind
      task-specific architectures. We introduce RAG models — a general-
      purpose fine-tuning recipe for retrieval-augmented generation —
      and demonstrate state-of-the-art results on three open-domain QA
      tasks.
    topics: [rag, retrieval-augmented-generation, qa, language-models, deep-learning]
    contribution_list:
      - "Introduces the RAG architecture combining pre-trained generators with non-parametric retrieval"
      - "State-of-the-art on three open-domain QA tasks"
      - "Demonstrates that retrieval improves factual accuracy and enables knowledge updating without retraining"
    cache_metadata:
      version: 1
      source: "bundled-corpus"
      skill_version: "1.0.0"

